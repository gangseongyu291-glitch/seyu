
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEYU | 쇼핑몰 컬렉션</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <header>
    <div class="container">
      <div class="user-status">
        <span id="creditDisplay">✨ 오늘 남은 무료 피팅: 3회</span>
      </div>
      <h1>SEYU CLOSET</h1>
      <p>가장 인기 있는 쇼핑몰을 한곳에서 만나보세요</p>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="쇼핑몰 이름이나 스타일 검색...">
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filter-tags">
      <button class="tag active" data-filter="all">전체</button>
      <button class="tag" data-filter="unisex">유니섹스</button>
      <button class="tag" data-filter="women">여성</button>
      <button class="tag" data-filter="designer">디자이너</button>
      <button class="tag" data-filter="street">스트릿</button>
      <button class="tag vton-btn" id="openFittingRoom">✨ AI 피팅룸 열기</button>
    </div>
    
    <div id="mallGrid" class="mall-grid">
      <!-- 쇼핑몰 카드가 JavaScript로 삽입될 자리입니다 -->
    </div>
  </main>

  <!-- 가상 피팅룸 모달 -->
  <div id="fittingRoomModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>✨ AI 가상 피팅룸</h2>
      <p class="modal-desc">내 사진에 마음에 드는 옷을 바로 입혀보세요.</p>
      
      <div class="vton-grid">
        <div class="upload-section">
          <label>1. 내 사진 업로드</label>
          <div class="drop-zone" id="userPhotoZone">
            <input type="file" id="userPhotoInput" hidden accept="image/*">
            <p>전신/상반신 사진</p>
            <img id="userPreview" class="preview-img" style="display:none;">
          </div>
        </div>
        
        <div class="upload-section">
          <label>2. 선택된 옷</label>
          <div class="drop-zone" id="garmentPhotoZone">
            <input type="file" id="garmentPhotoInput" hidden accept="image/*">
            <p id="garmentPlaceholder">쇼핑몰에서 선택하거나 업로드</p>
            <img id="garmentPreview" class="preview-img" style="display:none;">
          </div>
        </div>
      </div>

      <div class="vton-options">
        <label>사이즈/체형</label>
        <select id="sizeSelect">
          <option value="S">Slim (S)</option>
          <option value="M" selected>Regular (M)</option>
          <option value="L">Loose (L)</option>
          <option value="XL">Over (XL)</option>
        </select>
      </div>

      <button id="generateBtn" class="btn-primary">AI 피팅 시작하기 (1 크레딧)</button>

      <div class="api-settings">
        <button id="toggleApiSettings" class="btn-secondary">개발자 도구 (API 설정)</button>
        <div id="apiConfigArea" style="display:none; margin-top: 10px;">
          <input type="password" id="replicateToken" placeholder="Replicate API Token">
        </div>
      </div>

      <div id="resultSection" class="result-section" style="display:none;">
        <h3>피팅 결과</h3>
        <div id="loading" class="loading" style="display:none;">AI가 스타일을 분석 중입니다...</div>
        <img id="vtonResult" class="result-img">
        
        <div class="share-container">
          <p>이 스타일이 마음에 드시나요?</p>
          <div class="share-buttons">
            <button class="share-btn kakao">카카오톡</button>
            <button class="share-btn instagram">인스타그램</button>
            <button class="share-btn link">링크 복사</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 SEYU. All rights reserved.</p>
  </footer>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
