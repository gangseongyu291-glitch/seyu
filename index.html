
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEYU | 쇼핑몰 컬렉션</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <header>
    <div class="container">
      <h1>SEYU CLOSET</h1>
      <p>가장 인기 있는 쇼핑몰을 한곳에서 만나보세요</p>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="쇼핑몰 이름이나 스타일 검색...">
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filter-tags">
      <button class="tag active" data-filter="all">전체</button>
      <button class="tag" data-filter="unisex">유니섹스</button>
      <button class="tag" data-filter="women">여성</button>
      <button class="tag" data-filter="designer">디자이너</button>
      <button class="tag" data-filter="street">스트릿</button>
      <button class="tag vton-btn" id="openFittingRoom">✨ 가상 피팅룸</button>
    </div>
    
    <div id="mallGrid" class="mall-grid">
      <!-- 쇼핑몰 카드가 JavaScript로 삽입될 자리입니다 -->
    </div>
  </main>

  <!-- 가상 피팅룸 모달 -->
  <div id="fittingRoomModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>✨ AI 가상 피팅룸</h2>
      <p class="modal-desc">본인의 사진과 옷 사진을 올려 AI로 착용 샷을 생성합니다.</p>
      
      <div class="vton-grid">
        <div class="upload-section">
          <label>1. 내 사진 업로드 (전신/상반신)</label>
          <div class="drop-zone" id="userPhotoZone">
            <input type="file" id="userPhotoInput" hidden accept="image/*">
            <p>사진을 클릭하여 업로드</p>
            <img id="userPreview" class="preview-img" style="display:none;">
          </div>
        </div>
        
        <div class="upload-section">
          <label>2. 입어볼 옷 이미지</label>
          <div class="drop-zone" id="garmentPhotoZone">
            <input type="file" id="garmentPhotoInput" hidden accept="image/*">
            <p>옷 사진 업로드</p>
            <img id="garmentPreview" class="preview-img" style="display:none;">
          </div>
        </div>
      </div>

      <div class="vton-options">
        <label>사이즈/체형 설정</label>
        <select id="sizeSelect">
          <option value="S">Small (슬림)</option>
          <option value="M" selected>Medium (보통)</option>
          <option value="L">Large (루즈핏)</option>
          <option value="XL">X-Large (오버핏)</option>
        </select>
      </div>

      <div class="api-settings">
        <button id="toggleApiSettings" class="btn-secondary">⚙️ API 설정 (Replicate)</button>
        <div id="apiConfigArea" style="display:none; margin-top: 10px;">
          <input type="password" id="replicateToken" placeholder="Replicate API Token을 입력하세요">
          <p class="small-text">토큰은 브라우저에만 안전하게 저장됩니다.</p>
        </div>
      </div>

      <button id="generateBtn" class="btn-primary">AI 피팅 이미지 생성</button>

      <div id="resultSection" class="result-section">
        <h3>생성 결과</h3>
        <div id="loading" class="loading" style="display:none;">AI가 옷을 입혀드리는 중... (약 30~60초 소요)</div>
        <img id="vtonResult" class="result-img" style="display:none;">
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 SEYU. All rights reserved.</p>
  </footer>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
